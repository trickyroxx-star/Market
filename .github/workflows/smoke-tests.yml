name: Smoke Tests

on:
  schedule:
    - cron: '0 */6 * * *' # every 6 hours
  workflow_dispatch: {}

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run smoke tests (checkout + webhook)
        env:
          STRIPE_KEY: ${{ secrets.STRIPE_TEST_KEY }}
        run: |
          node workspace/reports/moltbook/stripe/create_test_invoice.js || true
          # Note: requires stripe test key in repo secrets (STRIPE_TEST_KEY)

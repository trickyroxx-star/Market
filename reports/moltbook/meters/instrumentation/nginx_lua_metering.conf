# nginx + lua (OpenResty) snippet to push metering events to a local collector
# Requires lua-resty-http and a collector endpoint

lua_shared_dict metering_queue 10m;

init_by_lua_block {
  http = require 'resty.http'
}

header_filter_by_lua_block {
  -- nothing here
}

log_by_lua_block {
  local cjson = require 'cjson.safe'
  local http = require 'resty.http'
  local req_id = ngx.var.request_id or ngx.var.request_time
  local event = {
    event_type = 'api_call',
    timestamp = ngx.localtime(),
    request_id = req_id,
    customer_id = ngx.req.get_headers()['x-customer-id'] or 'anonymous',
    product = 'api',
    endpoint = ngx.var.uri,
    response_status = ngx.status,
    duration_ms = math.floor(ngx.now() * 1000 - (ngx.req.start_time() * 1000)),
    raw_event = { method = ngx.req.get_method() }
  }
  local httpc = http.new()
  -- fire-and-forget to collector endpoint
  httpc:request_uri('http://127.0.0.1:4000/collector', { method = 'POST', body = cjson.encode(event), headers = { ['Content-Type']='application/json' }, keepalive = false })
}
